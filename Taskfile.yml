version: "3"

env:
  UV_CACHE_DIR: "{{.TASKFILE_DIR}}/tmp/uv-cache"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  setup:
    desc: Install all local development dependencies.
    deps:
      - setup:python
      - setup:frontend
      - setup:sympohy

  setup:python:
    desc: Install Python dependencies with uv.
    cmds:
      - uv sync --all-groups

  setup:frontend:
    desc: Install frontend dependencies with pnpm.
    cmds:
      - pnpm install

  setup:frontend:ci:
    desc: Install frontend dependencies from the lockfile.
    cmds:
      - pnpm install --frozen-lockfile

  setup:sympohy:
    desc: Validate local prerequisites for the repo-local sympohy issue runner.
    cmds:
      - uv run python -m scripts.sympohy setup

  # Review anchor for SIFTQ-89: pytest migration decision is tracked in ADR 0014.
  # See docs/adr/0014-pytest-as-default-python-test-runner.md
  pytest:
    desc: Run pytest with optional file targets and additional arguments (ADR 0014).
    cmds:
      - uv run python -m pytest {{.ARGS}} {{default "tests/sympohy" .FILES}}

  ci:
    desc: Run the local CI gate.
    cmds:
      - task: setup:python
      - task: ci:sympohy
      - task: ci:commit-messages
      - task: ci:markdown
      - task: ci:lint:task-refs
      - task: ci:lint:codex-task-perms
      - task: ci:typecheck
      - task: ci:lint
      - task: ci:test
      - task: ci:build
      - task: codd:version
      - task: codd:scan
      - task: codd:validate
      - task: codd:dag

  ci:sympohy:
    desc: Validate sympohy project configuration and required local tooling.
    cmds:
      - task: setup:sympohy
      - task: ai:sympohy:doctor

  ci:commit-messages:
    desc: Check commit message format for the current branch.
    cmds:
      - uv run python scripts/ci/check_commit_messages.py {{.CLI_ARGS}}

  ci:markdown:
    desc: Check Markdown formatting and repository document readability.
    cmds:
      - uv run python scripts/ci/check_markdown.py
      - uv run python scripts/ci/check_repository_documents.py

  ci:lint:task-refs:
    desc: Check that CI task references are defined in Taskfile.yml.
    cmds:
      - |
        set -eu
        refs="$(mktemp)"
        tasks="$(mktemp)"
        trap 'rm -f "$refs" "$tasks"' EXIT

        rg '^[[:space:]]*run:[[:space:]]*task([[:space:]]|$)' .github/workflows/ci.yml \
          | sed -E 's/^[[:space:]]*run:[[:space:]]*task[[:space:]]*//; s/[[:space:]].*$//; /^$/d' \
          | sort -u > "$refs"
        awk '
          /^tasks:/ { in_tasks = 1; next }
          in_tasks && /^[^[:space:]]/ { in_tasks = 0 }
          in_tasks && /^  [A-Za-z0-9_:-]+:/ {
            sub(/^  /, "")
            sub(/:$/, "")
            print
          }
        ' Taskfile.yml \
          | sort -u > "$tasks"

        missing="$(comm -23 "$refs" "$tasks")"
        if [ -n "$missing" ]; then
          printf 'Undefined task references in .github/workflows/ci.yml:\n%s\n' "$missing" >&2
          exit 1
        fi

  ci:lint:codex-task-perms:
    desc: Check that Taskfile tasks are allowed in Codex rules.
    cmds:
      - |
        set -eu
        tasks="$(mktemp)"
        allowed="$(mktemp)"
        trap 'rm -f "$tasks" "$allowed"' EXIT

        awk '
          /^tasks:/ { in_tasks = 1; next }
          in_tasks && /^[^[:space:]]/ { in_tasks = 0 }
          in_tasks && /^  [A-Za-z0-9_:-]+:/ {
            sub(/^  /, "")
            sub(/:$/, "")
            print
          }
        ' Taskfile.yml \
          | sort -u > "$tasks"
        rg 'prefix_rule\(pattern=\["task", "[^"]+"\], decision="allow"\)' .codex/rules/siftq.rules \
          | sed -E 's/.*\["task", "([^"]+)".*/\1/' \
          | sort -u > "$allowed"

        missing="$(comm -23 "$tasks" "$allowed")"
        if [ -n "$missing" ]; then
          printf 'Taskfile tasks missing Codex task allow rules:\n%s\n' "$missing" >&2
          exit 1
        fi

  ci:typecheck:
    desc: Run TypeScript typecheck.
    cmds:
      - pnpm typecheck

  ci:lint:
    desc: Run ESLint.
    cmds:
      - pnpm lint

  ci:test:
    desc: Run Vitest and the configured pytest suite (ADR 0014 review anchor).
    cmds:
      - pnpm test
      - task pytest

  ci:build:
    desc: Build the frontend.
    cmds:
      - pnpm build

  frontend:dev:
    desc: Start the Vite development server.
    cmds:
      - pnpm dev

  codd:version:
    desc: Check the required CoDD version.
    cmds:
      - uv run codd version --check

  codd:scan:
    desc: Scan the CoDD graph.
    cmds:
      - uv run codd scan

  codd:validate:
    desc: Validate CoDD documents.
    cmds:
      - uv run codd validate

  codd:dag:
    desc: Verify the CoDD DAG.
    cmds:
      - uv run codd dag verify

  codd:elicit:
    desc: Run CoDD elicitation.
    cmds:
      - uv run codd elicit

  ai:sympohy:
    desc: Run a single GitHub Issue through the sympohy automation, for example task ai:sympohy -- '#74'.
    cmds:
      - uv run python -m scripts.sympohy run {{.CLI_ARGS}}

  ai:sympohy:refine:
    desc: Inspect a GitHub Issue for the latest complete AC/DoD set, for example task ai:sympohy:refine -- '#74'.
    cmds:
      - uv run python -m scripts.sympohy refine {{.CLI_ARGS}}

  ai:sympohy:resume:
    desc: Resume a stale or interrupted sympohy run, for example task ai:sympohy:resume -- '#79'.
    cmds:
      - uv run python -m scripts.sympohy resume {{.CLI_ARGS}}

  ai:sympohy:doctor:
    desc: Validate sympohy config, labels, systemd templates, Codex, hooks, and GitHub prerequisites.
    cmds:
      - uv run python -m scripts.sympohy doctor

  ai:sympohy:labels:sync:
    desc: Create/update sympohy labels and delete legacy task labels.
    cmds:
      - uv run python -m scripts.sympohy labels-sync

  ai:sympohy:migrate:
    desc: Migrate legacy task labels to sympohy labels, for example task ai:sympohy:migrate -- '#73' or --all.
    cmds:
      - uv run python -m scripts.sympohy migrate {{.CLI_ARGS}}

  ai:sympohy:watch:
    desc: Watch open GitHub issues and start up to 10 independent sympohy workers.
    cmds:
      - uv run python -m scripts.sympohy watch

  ai:sympohy:systemd:install:
    desc: Install and start the systemd --user timer that runs sympohy every minute.
    cmds:
      - uv run python -m scripts.sympohy systemd-install

  ai:sympohy:systemd:status:
    desc: Show sympohy systemd --user timer/service status and recent logs.
    cmds:
      - uv run python -m scripts.sympohy systemd-status
