version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  setup:
    desc: Install all local development dependencies.
    deps:
      - setup:python
      - setup:frontend
      - setup:sympohy

  setup:python:
    desc: Install Python dependencies with uv.
    cmds:
      - uv sync --all-groups

  setup:frontend:
    desc: Install frontend dependencies with pnpm.
    cmds:
      - pnpm install

  setup:frontend:ci:
    desc: Install frontend dependencies from the lockfile.
    cmds:
      - pnpm install --frozen-lockfile

  setup:sympohy:
    desc: Validate local prerequisites for the repo-local sympohy issue runner.
    cmds:
      - uv run python -m scripts.sympohy setup

  ci:
    desc: Run the local CI gate.
    cmds:
      - task: ci:sympohy
      - task: ci:commit-messages
      - task: ci:markdown
      - task: ci:typecheck
      - task: ci:lint
      - task: ci:test
      - task: ci:build
      - task: codd:version
      - task: codd:scan
      - task: codd:validate
      - task: codd:dag

  ci:sympohy:
    desc: Validate sympohy project configuration and required local tooling.
    cmds:
      - task: setup:sympohy
      - task: ai:sympohy:doctor

  ci:commit-messages:
    desc: Check commit message format for the current branch.
    cmds:
      - uv run python scripts/ci/check_commit_messages.py {{.CLI_ARGS}}

  ci:markdown:
    desc: Check Markdown formatting.
    cmds:
      - uv run python scripts/ci/check_markdown.py

  ci:typecheck:
    desc: Run TypeScript typecheck.
    cmds:
      - pnpm typecheck

  ci:lint:
    desc: Run ESLint.
    cmds:
      - pnpm lint

  ci:test:
    desc: Run Vitest.
    cmds:
      - pnpm test
      - uv run python -m unittest discover tests/sympohy -p "*_test.py"

  ci:build:
    desc: Build the frontend.
    cmds:
      - pnpm build

  frontend:dev:
    desc: Start the Vite development server.
    cmds:
      - pnpm dev

  codd:version:
    desc: Check the required CoDD version.
    cmds:
      - uv run codd version --check

  codd:scan:
    desc: Scan the CoDD graph.
    cmds:
      - uv run codd scan

  codd:validate:
    desc: Validate CoDD documents.
    cmds:
      - uv run codd validate

  codd:dag:
    desc: Verify the CoDD DAG.
    cmds:
      - uv run codd dag verify

  codd:elicit:
    desc: Run CoDD elicitation.
    cmds:
      - uv run codd elicit

  ai:sympohy:
    desc: Run a single GitHub Issue through the sympohy automation, for example task ai:sympohy -- '#74'.
    cmds:
      - uv run python -m scripts.sympohy run {{.CLI_ARGS}}

  ai:sympohy:refine:
    desc: Inspect a GitHub Issue for the latest complete AC/DoD set, for example task ai:sympohy:refine -- '#74'.
    cmds:
      - uv run python -m scripts.sympohy refine {{.CLI_ARGS}}

  ai:sympohy:resume:
    desc: Resume a stale or interrupted sympohy run, for example task ai:sympohy:resume -- '#79'.
    cmds:
      - uv run python -m scripts.sympohy resume {{.CLI_ARGS}}

  ai:sympohy:doctor:
    desc: Validate sympohy config, labels, systemd templates, Codex, hooks, and GitHub prerequisites.
    cmds:
      - uv run python -m scripts.sympohy doctor

  ai:sympohy:labels:sync:
    desc: Create/update sympohy labels and delete legacy ai:* labels.
    cmds:
      - uv run python -m scripts.sympohy labels-sync

  ai:sympohy:migrate:
    desc: Migrate legacy task labels to sympohy labels, for example task ai:sympohy:migrate -- '#73' or --all.
    cmds:
      - uv run python -m scripts.sympohy migrate {{.CLI_ARGS}}

  ai:sympohy:watch:
    desc: Watch open GitHub issues and start up to 10 independent sympohy workers.
    cmds:
      - uv run python -m scripts.sympohy watch

  ai:sympohy:systemd:install:
    desc: Install and start the systemd --user timer that runs sympohy every minute.
    cmds:
      - uv run python -m scripts.sympohy systemd-install

  ai:sympohy:systemd:status:
    desc: Show sympohy systemd --user timer/service status and recent logs.
    cmds:
      - uv run python -m scripts.sympohy systemd-status
