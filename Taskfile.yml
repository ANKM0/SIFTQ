version: "3"

env:
  UV_CACHE_DIR: "{{.TASKFILE_DIR}}/tmp/uv-cache"
  PLAYWRIGHT_BROWSERS_PATH: "{{.TASKFILE_DIR}}/tmp/playwright-browsers"

includes:
  setup:
    taskfile: ./taskfile/setup.yml
    dir: .
    flatten: true
  ci:
    taskfile: ./taskfile/ci.yml
    dir: .
    flatten: true
  frontend:
    taskfile: ./taskfile/frontend.yml
    dir: .
    flatten: true
  repository:
    taskfile: ./taskfile/repository.yml
    dir: .
    flatten: true
  codex:
    taskfile: ./taskfile/codex.yml
    dir: .
    flatten: true
  release:
    taskfile: ./taskfile/release.yml
    dir: .
    flatten: true
  taqt:
    taskfile: ./taskfile/taqt.yml
    dir: .
  docs:
    taskfile: ./taskfile/docs.yml
    dir: .

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list
