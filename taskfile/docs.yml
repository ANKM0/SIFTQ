version: "3"

tasks:
  screen-flow:fsm:d2:svg:
    desc: Generate the D2 screen-flow FSM SVG.
    cmds:
      - d2 docs/requirements/assets/screen-flow-fsm.d2 docs/requirements/assets/screen-flow-fsm.svg

  domain:svg:
    desc: Validate the domain model and generate its diagrams (domain / logical / physical / flow / nav).
    cmds:
      - bun scripts/domain-model/generate.ts
      - d2 --pad 10 docs/requirements/assets/domain-model/domain-model.d2 docs/requirements/assets/domain-model/generated/domain-model.svg
      - |
        for name in logical physical flow nav; do
          d2 --pad 10 "docs/requirements/assets/domain-model/generated/${name}.d2" "docs/requirements/assets/domain-model/generated/${name}.svg"
        done
      - bun scripts/domain-model/patch-svg.ts

  domain:viewer:
    desc: Generate the domain diagrams and report the viewer entry point.
    cmds:
      - task: domain:svg
      - echo "Open docs/requirements/assets/domain-model/viewer.html"
