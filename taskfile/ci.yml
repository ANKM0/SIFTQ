version: "3"

tasks:
  pytest:
    desc: Run pytest with optional file targets and additional arguments.
    cmds:
      - uv run python -m pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ARGS}} {{.FILES}}{{end}}

  ci:
    desc: Run the local CI gate.
    cmds:
      - task: setup:python
      - task: setup:frontend:ci
      - task: ci:markdown
      - task: ci:lint:task-refs
      - task: ci:lint:codex-task-perms
      - task: ci:lint
      - task: ci:lint:python
      - task: ci:lint:ts-fast
      - task: ci:security
      - task: ci:performance
      - task: ci:requirements
      - task: ci:architecture
      - task: ci:glossary
      - task: ci:docs
      - task: ci:typecheck
      - task: ci:test
      - task: ci:build
      - task: ci:duplicate
      - task: ci:dead-code

  ci:commit-messages:
    desc: Check commit message format for the current branch.
    cmds:
      - uv run python scripts/ci/check_commit_messages.py {{.CLI_ARGS}}

  ci:markdown:
    desc: Check Markdown formatting.
    cmds:
      - uv run python scripts/ci/check_markdown.py

  ci:security:
    desc: Reject vulnerable dependencies and dangerous code patterns.
    cmds:
      - bun audit --audit-level high
      - uv run python scripts/ci/check_security_patterns.py

  ci:performance:
    desc: Reject D1 query anti-patterns.
    cmds:
      - uv run python scripts/ci/check_db_queries.py

  ci:requirements:
    desc: Reject source modules without tests.
    cmds:
      - uv run python scripts/ci/check_requirements.py

  ci:architecture:
    desc: Reject unexpected imports, dependency-direction, and cycle violations.
    cmds:
      - vp exec depcruise src --config .dependency-cruiser.cjs
      - uv run python scripts/ci/check_architecture.py

  ci:architecture:metrics:
    desc: Print dependency stability metrics with dependency-cruiser.
    cmds:
      - vp exec depcruise src --config .dependency-cruiser.cjs --metrics --output-type json

  ci:glossary:
    desc: Reject glossary term variants in documentation.
    cmds:
      - uv run python scripts/ci/check_glossary.py

  ci:docs:
    desc: Require mapped documentation updates for changed paths.
    cmds:
      - uv run python scripts/ci/check_docs.py
  ci:llm-eval:
    desc: Run the LLM evaluation smoke suite.
    env:
      PROMPTFOO_CONFIG_DIR: "{{.ROOT_DIR}}/tmp/promptfoo"
    cmds:
      - uv run python scripts/ci/llm_eval_budget.py --limit-file eval/budget.json --spent-file tmp/llm-eval-spent.json
      - bunx promptfoo@0.122.0 eval --config eval/promptfoo/promptfooconfig.yaml

  eval:review:
    desc: Run the real review classification eval using the active Codex provider.
    env:
      PROMPTFOO_CONFIG_DIR: "{{.ROOT_DIR}}/tmp/promptfoo"
    cmds:
      - uv run python scripts/ci/llm_eval_budget.py --limit-file eval/budget.json --spent-file tmp/llm-eval-spent.json
      - uv run python scripts/ci/llm_eval_provider.py
      - bunx promptfoo@0.122.0 eval --config eval/promptfooconfig.real.yaml

  ci:lint:task-refs:
    desc: Check that CI task references are defined in Taskfile.yml.
    cmds:
      - |
        set -eu
        refs="$(mktemp)"
        tasks="$(mktemp)"
        trap 'rm -f "$refs" "$tasks"' EXIT

        rg '^[[:space:]]*run:[[:space:]]*task([[:space:]]|$)' .github/workflows/ci.yml \
          | sed -E 's/^[[:space:]]*run:[[:space:]]*task[[:space:]]*//; s/[[:space:]].*$//; /^$/d' \
          | sort -u > "$refs"
        task --list --json \
          | uv run python -c 'import json, sys; [print(task["name"]) for task in json.load(sys.stdin)["tasks"]]' \
          | sort -u > "$tasks"

        missing="$(comm -23 "$refs" "$tasks")"
        if [ -n "$missing" ]; then
          printf 'Undefined task references in .github/workflows/ci.yml:\n%s\n' "$missing" >&2
          exit 1
        fi

  ci:lint:codex-task-perms:
    desc: Check that Taskfile tasks are allowed in Codex rules.
    cmds:
      - |
        set -eu
        tasks="$(mktemp)"
        allowed="$(mktemp)"
        trap 'rm -f "$tasks" "$allowed"' EXIT

        task --list --json \
          | uv run python -c 'import json, sys; [print(task["name"]) for task in json.load(sys.stdin)["tasks"]]' \
          | sort -u > "$tasks"
        rg 'prefix_rule\(pattern=\["task", "[^"]+"\], decision="allow"\)' .codex/rules/siftq.rules \
          | sed -E 's/.*\["task", "([^"]+)".*/\1/' \
          | sort -u > "$allowed"

        missing="$(comm -23 "$tasks" "$allowed")"
        if [ -n "$missing" ]; then
          printf 'Taskfile tasks missing Codex task allow rules:\n%s\n' "$missing" >&2
          exit 1
        fi

  ci:typecheck:
    desc: Run TypeScript typecheck.
    cmds:
      - |
        if [ ! -d src ]; then
          echo "Skipping TypeScript typecheck: src/ does not exist yet."
          exit 0
        fi
        vp run typecheck

  ci:lint:
    desc: Run Vite+ lint.
    cmds:
      - vp lint .

  ci:lint:python:
    desc: Run ruff on scripts/ci with the safe pyflakes rule set.
    cmds:
      - uv run ruff check scripts/ci --select E4,E7,E9,F

  ci:lint:ts-fast:
    desc: Run fast lint on src and tests.
    cmds:
      - vp lint src tests

  ci:test:
    desc: Run Vitest and Playwright E2E.
    cmds:
      - |
        if [ ! -d src ]; then
          echo "Skipping Worker tests: src/ does not exist yet."
          exit 0
        fi
        vp test run --passWithNoTests
        if ! find tests/e2e -type f -print -quit 2>/dev/null | grep -q .; then
          echo "Skipping Playwright E2E: no test files found."
          exit 0
        fi
        vp exec playwright install chromium
        set -eu
        browser="$(find "${PLAYWRIGHT_BROWSERS_PATH}" -path '*chrome-headless-shell' -type f | head -n 1)"
        if [ -z "${browser}" ]; then
          echo "Playwright Chromium executable was not installed into ${PLAYWRIGHT_BROWSERS_PATH}." >&2
          exit 1
        fi

        missing="$(ldd "${browser}" | awk '/not found/ { print $1 }')"
        if [ -n "${missing}" ]; then
          echo "Skipping Playwright E2E locally because Chromium is missing shared libraries:" >&2
          printf '%s\n' "${missing}" >&2
          echo "Install the Playwright Linux deps and rerun 'task ci:test' to execute E2E locally." >&2
          if [ "${CI:-}" = "true" ]; then
            exit 1
          fi
          exit 0
        fi

        bun x wrangler d1 migrations apply siftq --local
        vp run test:e2e

  ci:build:
    desc: Build the Worker.
    cmds:
      - |
        if [ ! -f src/index.tsx ]; then
          echo "Skipping Worker build: src/index.tsx does not exist yet."
          exit 0
        fi
        vp run build

  ci:duplicate:
    desc: Reject duplicated production TypeScript code.
    cmds:
      - |
        if [ ! -d src ]; then
          echo "Skipping duplication scan: src/ does not exist yet."
          exit 0
        fi
        vp exec jscpd src --config .jscpd.json

  ci:dead-code:
    desc: Reject unused TypeScript exports, files, and types.
    cmds:
      - |
        if [ ! -d src ]; then
          echo "Skipping dead-code scan: src/ does not exist yet."
          exit 0
        fi
        vp exec knip --config knip.json

