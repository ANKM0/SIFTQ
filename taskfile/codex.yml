version: "3"

tasks:
  self-improvement:scan:
    desc: Scan Codex sessions for recurring improvement candidates; add --execute to create Issues.
    cmds:
      - uv run python -m taqt.session_improvement {{.CLI_ARGS}}

  codex:codex:
    desc: Run Codex using the main/OpenAI profile.
    cmds:
      - codex {{.CLI_ARGS}}

  codex:deepseek:
    desc: Run Codex using the DeepSeek V4 Flash 0731 profile.
    cmds:
      - codex --profile deepseek0731 {{.CLI_ARGS}}

  codex:deepseek:pro:
    desc: Run Codex using the DeepSeek V4 Pro profile.
    cmds:
      - codex --profile deepseek {{.CLI_ARGS}}

  codex:profiles:init:
    desc: Create missing shared DeepSeek Codex profiles without overwriting existing files.
    cmds:
      - uv run python scripts/codex_profiles.py init

  codex:profiles:check:
    desc: Validate shared DeepSeek Codex profiles and required API key environment variables.
    cmds:
      - uv run python scripts/codex_profiles.py check --require-env
