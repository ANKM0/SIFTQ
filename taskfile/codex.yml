version: "3"

tasks:
  self-improvement:scan:
    desc: Scan Codex sessions for recurring improvement candidates; add --execute to create Issues.
    cmds:
      - uv run python -m taqt.session_improvement {{.CLI_ARGS}}

  codex:codex:
    desc: Run Codex using the main/OpenAI profile.
    cmds:
      - codex {{.CLI_ARGS}}

  codex:deepseek:
    desc: Run Codex using the DeepSeek V4 Pro profile.
    cmds:
      - codex --profile deepseek {{.CLI_ARGS}}

  codex:luna:
    desc: Run Codex using the OpenRouter GPT-5.6-Luna Pro profile.
    cmds:
      - codex --profile luna-openrouter {{.CLI_ARGS}}

  codex:muse-spark:free:
    desc: Run Codex using the OpenCode Zen Muse Spark 1.3 Contributor Free profile.
    cmds:
      - codex --profile muse-spark-opencode-free {{.CLI_ARGS}}

  codex:profiles:init:
    desc: Create missing shared Codex provider profiles without overwriting existing files.
    cmds:
      - uv run python scripts/codex_profiles.py init

  codex:profiles:check:
    desc: Validate shared Codex provider profiles, shared home paths, and required API key environment variables.
    cmds:
      - uv run python scripts/codex_profiles.py check --require-env
      - uv run python scripts/codex_rule_coverage.py --check
