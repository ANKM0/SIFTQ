version: "3"

env:
  PYTHONPATH: ".taqt/scripts"

tasks:
  create:
    desc: Create a taqt task from a taqt:enabled GitHub Issue.
    cmds:
      - uv run python -m taqt.task_create {{.CLI_ARGS}}

  run:
    desc: Run a taqt:enabled task through the configured development feedback loop.
    cmds:
      - uv run python -m taqt.task_run {{.CLI_ARGS}}

  switch:show:
    desc: Show the active Codex/taqt profile.
    cmds:
      - uv run python scripts/switch_codex_profile.py show

  switch:main:
    desc: Switch Codex and taqt to the main/OpenAI profile.
    cmds:
      - uv run python scripts/switch_codex_profile.py set main
      - |
        export CODEX_HOME="$(uv run python scripts/switch_codex_profile.py path main)"
        codex login

  switch:deepseek:
    desc: Switch Codex and taqt to the DeepSeek profile.
    cmds:
      - uv run python scripts/switch_codex_profile.py set deepseek
      - |
        export CODEX_HOME="$(uv run python scripts/switch_codex_profile.py path deepseek)"

  switch:qwen:
    desc: Switch Codex and taqt to the Qwen/OpenRouter profile.
    cmds:
      - uv run python scripts/switch_codex_profile.py set qwen
      - |
        export CODEX_HOME="$(uv run python scripts/switch_codex_profile.py path qwen)"

  auto:
    desc: Run a taqt:enabled task through run, commit, push, PR, and optional merge routing.
    cmds:
      - uv run python -m taqt.task_auto {{.CLI_ARGS}}

  decompose:
    desc: Decompose taqt tasks into child tasks capped at about five minutes each.
    cmds:
      - uv run python -m taqt.task_decompose {{.CLI_ARGS}}

  cleanup:
    desc: Clean up a taqt task worktree and optionally recover stale running tasks.
    cmds:
      - uv run python -m taqt.task_cleanup {{.CLI_ARGS}}

  worker:
    desc: Run pending taqt:enabled tasks in parallel, one git worktree per task.
    cmds:
      - uv run python -m taqt.task_worker {{.CLI_ARGS}}

  watch:
    desc: Watch taqt:enabled GitHub Issues and create/update taqt tasks.
    cmds:
      - uv run python -m taqt.github_watch {{.CLI_ARGS}}

  sync:
    desc: Sync a taqt task progress comment to its GitHub Issue.
    cmds:
      - uv run python -m taqt.github_sync {{.CLI_ARGS}}

  self-improvement:
    desc: Create a self-improvement request for a taqt task.
    cmds:
      - uv run python -m taqt.self_improvement {{.CLI_ARGS}}

  worktree:
    desc: Create or print the Issue branch/worktree command for a taqt task.
    cmds:
      - uv run python -m taqt.git_worktree {{.CLI_ARGS}}

  commit:
    desc: Commit loop-produced workspace changes for a taqt task.
    cmds:
      - uv run python -m taqt.git_commit {{.CLI_ARGS}}

  push:
    desc: Push the Issue branch for a taqt task.
    cmds:
      - uv run python -m taqt.git_push {{.CLI_ARGS}}

  pr:
    desc: Create or print the GitHub PR command for a taqt task.
    cmds:
      - uv run python -m taqt.github_pr {{.CLI_ARGS}}

  merge:
    desc: Check and merge the GitHub PR for a taqt task.
    cmds:
      - uv run python -m taqt.github_merge {{.CLI_ARGS}}

  route:dry-run:
    desc: Print the main post-run route commands for a taqt task without executing git or GitHub changes.
    cmds:
      - task taqt:worktree -- {{.CLI_ARGS}}
      - task taqt:commit -- {{.CLI_ARGS}}
      - task taqt:push -- {{.CLI_ARGS}}
      - task taqt:pr -- {{.CLI_ARGS}}

  report:
    desc: Print a Markdown summary for a taqt run directory.
    cmds:
      - uv run python -m taqt.run_report {{.CLI_ARGS}}
