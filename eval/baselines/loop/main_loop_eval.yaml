# Eval copy of the simplified main_loop for paired replay (arm A). Not used at runtime.
version: 1
id: main_loop_eval

limits:
  max_iterations: 12
  max_fix_attempts: 3
  provider_retries: 3

agents:
  implement:
    role: implementation
    adapter: opencode
    model: opencode-go/deepseek-v4.1-flash
    reasoning_effort: high
  fix:
    role: implementation_fixer
    adapter: opencode
    model: opencode-go/deepseek-v4.1-flash
    reasoning_effort: high

steps:
  - id: implement
    kind: llm
    agent: implement
    next: verification
    on_failure: fix
  - id: verification
    kind: verification
    on_pass: done
    on_fix: fix
    on_human: human
  - id: fix
    kind: llm
    agent: fix
    next: verification
    on_failure: fix
  - id: done
    kind: terminal
  - id: human
    kind: terminal
