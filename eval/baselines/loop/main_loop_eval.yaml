# Eval copy of the current main_loop for paired replay (arm A). Not used at runtime.
# Same structure as .taqt/loops/main_loop.yaml, with opencode-go provider models so
# the replay can run when the opencode provider is unavailable.
version: 1
id: main_loop_eval

limits:
  max_iterations: 12
  max_fix_attempts: 3

agents:
  implement:
    role: implementation
    adapter: opencode
    model: opencode-go/muse-spark-1.3-contributor
    reasoning_effort: high
  fix:
    role: implementation_fixer
    adapter: opencode
    model: opencode-go/muse-spark-1.3-contributor
    reasoning_effort: high
  checker:
    role: checker
    adapter: opencode
    model: opencode-go/gpt-5.6-luna
    reasoning_effort: xhigh
    readonly: true

steps:
  - id: implement
    kind: llm
    agent: implement
    next: verification
  - id: verification
    kind: verification
    on_pass: checker
    on_fix: fix
    on_human: human
  - id: fix
    kind: llm
    agent: fix
    next: verification
    on_failure: human
  - id: checker
    kind: llm
    agent: checker
    next: post_review
  - id: post_review
    kind: post_review
    on_pass: done
    on_fix: fix
    on_human: human
  - id: done
    kind: terminal
  - id: human
    kind: terminal
