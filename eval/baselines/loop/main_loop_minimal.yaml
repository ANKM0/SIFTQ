# Baseline: minimal loop for paired replay (arm B). Not used at runtime.
# Current main_loop without the checker / post_review review structure. fix is kept.
version: 1
id: main_loop_minimal

limits:
  max_iterations: 8
  max_fix_attempts: 3

agents:
  implement:
    role: implementation
    adapter: opencode
    model: opencode/muse-spark-1.3-contributor-free
    reasoning_effort: high
  fix:
    role: implementation_fixer
    adapter: opencode
    model: opencode/muse-spark-1.3-contributor-free
    reasoning_effort: high

steps:
  - id: implement
    kind: llm
    agent: implement
    next: verification
  - id: verification
    kind: verification
    on_pass: done
    on_fix: fix
    on_human: human
  - id: fix
    kind: llm
    agent: fix
    next: verification
    on_failure: human
  - id: done
    kind: terminal
  - id: human
    kind: terminal
