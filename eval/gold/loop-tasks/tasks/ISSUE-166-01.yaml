    title: taqt run artifactへ設計判断を移す
    body: "## 背景\n\nPR ごとに Design Doc を作成する規約に対し、現行の `docs/design/` には taqt 導入方針を記録した\
      \ #134 と、完了済み PR の設計記録である #165 がある。taqt はすでに run ごとの `state.json`、`events.jsonl`、artifact\
      \ を持つため、実装時の設計判断と検証結果を run に集約する。\n\n## 概要\n\nDesign step の判断を taqt run artifact\
      \ として保存し、時系列イベントと report から参照可能にする。PR ごとの Design Doc 運用を廃止し、#134 の恒久的な方針は ADR\
      \ へ移管する。\n\n## Scope\n\n- やること:\n  - design step が `artifacts/design-decision.md`\
      \ を生成・保存する。\n  - artifact に課題・制約、採用案と理由、却下案と理由、影響範囲・検証結果、未決事項または人間へのエスカレーションを記録する。\n\
      \  - `events.jsonl` に artifact のパス・要約・作成状態を構造化して記録し、run report から参照できるようにする。\n\
      \  - #134 の恒久的な taqt 方針を新 ADR に簡潔に移管し、ADR 0002 を supersede する。\n  - `docs/design/`、テンプレート、作成スクリプト、Design\
      \ Doc skill、loop の `docs/design/` 書込み権限を廃止し、関連 ADR の参照を更新する。\n  - #165 の Design\
      \ Doc と一覧上の項目を削除する。ADR 0011 の判断本文と Issue #165 への参照は保持し、影響範囲・参考リンクから Design Doc\
      \ #165 への参照だけを除去する。\n  - artifact 生成、event、report、移管後のドキュメント参照をテストする。\n- やらないこと:\n\
      \  - GitHub Issue にある要求、AC、DoD の正本を taqt へ移すこと。\n  - taqt run を横断集計して loop や\
      \ prompt を自動改善する機能。\n  - taqt 以外の通常開発における ADR 運用の変更。\n  - ADR 0011 が定める reasoning\
      \ effort の解決規則を変更すること。\n\n## AC\n\n- [ ] 成功した design step ごとに、`artifacts/design-decision.md`\
      \ が run 内へ保存される。\n- [ ] artifact に、課題・制約、採用案と理由、却下案と理由、影響範囲・検証結果、未決事項または人間へのエスカレーションの5項目が含まれる。\n\
      - [ ] artifact のパス、要約、作成状態を持つイベントが `events.jsonl` に残る。\n- [ ] `task taqt:report`\
      \ が design decision artifact への参照を表示する。\n- [ ] #134 の恒久的方針が新 ADR に移管され、ADR 0002\
      \ は superseded になる。移管後に #134 は削除される。\n- [ ] `docs/design/`、テンプレート、作成スクリプト、Design\
      \ Doc skill、loop の `docs/design/` 書込み権限が削除され、リポジトリ内の参照は taqt artifact / ADR\
      \ / requirements を参照する表現へ更新される。\n- [ ] #165 と Design Doc 一覧項目が削除され、ADR 0011\
      \ に Design Doc #165 へのリンクが残らない。ADR 0011 の判断本文と Issue #165 へのリンクは維持される。\n\n##\
      \ DoD\n\n- [ ] artifact 内容、event、report、Design Doc 運用基盤の除去、#134/#165 と関連 ADR\
      \ 参照の整理を検証するテストを追加・更新する。\n- [ ] taqt の対象テストと Markdown CI が通る。\n- [ ] 一回の run\
      \ で artifact、event、report の追跡性を確認し、実行結果を PR に記録する。\n- [ ] `git diff` で既存の未コミット変更を変更・削除していないことを確認する。\n\
      \n## 補足情報\n\n- `events.jsonl` は時系列・索引用、判断本文は artifact 用とする。\n- run 横断の集計と改善は、artifact\
      \ の形式が安定してから後続 Issue で扱う。\n- #165 の削除は Design Doc 運用廃止に伴う整理であり、ADR 0011 の技術的決定を廃止するものではない。\n\
      - 参照: `docs/design/#134.md`、`docs/adr/0002-separate-adr-and-design-docs.md`、`docs/adr/0011-resolve-loop-reasoning-effort-in-codex-adapter.md`、`.taqt/scripts/loop/runner.py`"
