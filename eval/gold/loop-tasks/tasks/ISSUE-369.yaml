input:
  issue:
    title: Task一覧にページングを追加
    body: "## 背景\nTask一覧は件数が増えると1ページに全件表示され、一覧性と操作性が低下する。25件を境にページを分けて表示できるようにする。\n\
      \n## 概要\nTask一覧にページングを追加する。status絞り込み後の件数が25件までは1ページ、26件以上は2ページ目以降に分けて表示する。\n\
      \n## Scope\n- やること:\n  - status絞り込み後のタスクを25件単位でページ分割する。\n  - 1-25件目を1ページ目、26件目以降を2ページ目以降に表示する。\n\
      \  - ページ切替UI（ページ番号、前へ/次へ）をTask一覧に追加する。\n  - status切替とページ指定を両立させる。\n  - ページングの実装方式とUIをADRに記録する。\n\
      - やらないこと:\n  - スマホ向けのボタン押下・横スライド移動（後続issueで対応）。\n  - Matrix、Task detail、New\
      \ taskの変更。\n  - 1ページあたり件数の変更可能化（25件固定）。\n\n## AC\n- [ ] status絞り込み後の件数が25件以下の場合、ページングUIを表示せず全件表示する。\n\
      - [ ] 26件以上の場合、1ページ目に1-25件目を表示する。\n- [ ] 2ページ目に26件目以降を表示する。\n- [ ] ページ番号・前へ・次へでページを移動できる。\n\
      - [ ] statusを切り替えた場合、ページ指定を維持または1ページ目に戻り、矛盾した表示にならない。\n- [ ] 不正なページ指定（範囲外・数値以外）では1ページ目または最終ページにフォールバックする。\n\
      \n## DoD\n- [ ] ページ分割とページ切替を実装する。\n- [ ] ページングのE2Eテストを追加する。\n- [ ] requirementsとADRを更新する。\n\
      - [ ] typecheck、lint、unit test、E2E testが成功する。\n- [ ] PRを作成し、CI結果を確認してマージ可否を判断する。\n\
      \n## 補足情報\n- 1ページあたり25件固定。\n- スマホ向けのページング操作（ボタン押下・横スライド移動）は後続対応とし、本issueではデスクトップのページ切替UIまでを対象とする。\n"
    labels:
    - taqt:enabled
