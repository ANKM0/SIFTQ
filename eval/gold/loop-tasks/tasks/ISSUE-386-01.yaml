    title: SHアーキテクチャの実装方針を構造体・最小interface・純粋関数へ統一
    body: "## 背景\n\n現在の設計資料は、SH アーキテクチャについて「IF を利用しない」「repository interface や storage\
      \ adapter は先に作らない」と定義している。一方、実装には `TaskRepository` interface と repository class\
      \ が存在しており、アーキテクチャと実装に乖離がある。\n\ndomain は、構造体型・純粋関数・`Result` を中心に実装し、副作用境界だけに最小限の\
      \ interface を置く方針へ統一する。\n\n## 概要\n\nSH アーキテクチャを「不要な抽象化や層分割は避け、副作用境界に限り最小限の interface\
      \ を使用する軽量アーキテクチャ」として再定義する。\n\ndomain では構造体型、`Result`、純粋関数を使用し、DB、HTTP、Hono、`Date`、`crypto`\
      \ などの副作用へ依存しない。repository adapter は class ではなく、factory function と object literal\
      \ で実装する。\n\n## Scope\n\n- やること:\n  - ADR 0006 と architecture documentation を新方針へ更新する\n\
      \  - アーキテクチャ図を実装方針と一致させる\n  - domain の副作用を外側へ分離する\n  - domain の業務ロジックを構造体型・純粋関数・`Result`\
      \ へ統一する\n  - repository interface を副作用境界の最小 interface として整理する\n  - repository\
      \ adapter の app-owned class を factory function + object literal へ置き換える\n  -\
      \ domain の依存方向、class 使用、副作用依存を CI で検査する\n  - repository 契約テストと domain テストを方針に合わせて更新する\n\
      - やらないこと:\n  - Decision パターンの導入\n  - UI 機能の変更\n  - DB スキーマの変更\n  - 全体的な usecase\
      \ 層の再設計\n  - 外部ライブラリの class 利用禁止\n\n## AC\n\n- [ ] domain の実装方針が ADR 0006、architecture\
      \ documentation、アーキテクチャ図で同じ内容になっている\n- [ ] domain は構造体型、純粋関数、`Result` で実装され、DB・HTTP・Hono・時刻・乱数・暗号\
      \ API に依存していない\n- [ ] interface の利用箇所と利用理由が、副作用境界に限定されている\n- [ ] repository\
      \ adapter にアプリケーション固有の class が存在しない\n- [ ] domain から presentation と repository\
      \ adapter への依存が CI で拒否される\n- [ ] domain の class 使用と副作用 API 依存が CI で拒否される\n-\
      \ [ ] `TaskRepository` の in-memory 実装と D1 実装が interface 契約を満たしている\n- [ ] domain\
      \ の期待される失敗が `Result<T, E>` で表現され、presentation 層で適切に変換される\n- [ ] 既存の domain、repository、API、UI\
      \ のテストが成功する\n\n## DoD\n\n- [ ] 実装、ADR、architecture documentation、図の内容を相互に確認している\n\
      - [ ] architecture checker と dependency-cruiser の検査を CI で実行している\n- [ ] typecheck、unit\
      \ test、repository contract test が成功している\n- [ ] 変更対象に対応するテストが追加または更新されている\n-\
      \ [ ] `graphify update .` を実行して設計変更を反映している\n\n## 補足情報\n\n- 参照: `docs/adr/0006-adopt-lightweight-application-architecture.md`\n\
      - 参照: `docs/adr/0029-adopt-result-type-in-domain-usecase.md`\n- 参照: `docs/contributing/architecture.md`\n\
      - 参照: `https://zenn.dev/tellernovel_inc/articles/0193eb68cabb6e`\n- taqt 対象外\n"
