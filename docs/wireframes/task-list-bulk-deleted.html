<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - タスク一括削除後</title>
    <link rel="stylesheet" href="./matrix-mvp.css" />
  </head>
  <body>
    <main class="app-shell task-page">
      <header class="app-header">
        <div><h1>SIFTQ</h1><p>状態: タスク一括削除後</p></div>
        <nav class="header-actions" aria-label="Primary">
          <a class="back-link" href="./matrix-with-cards.html">マトリックス</a>
          <a class="back-link back-link--active" href="./task-list.html">タスク一覧</a>
          <a class="back-link" href="./index.html">インデックス</a>
        </nav>
      </header>

      <section class="task-list-shell" aria-labelledby="task-list-bulk-deleted-title">
        <div class="notice notice--success" role="status">選択したタスクを削除しました</div>
        <header class="task-list-header">
          <div>
            <h2 id="task-list-bulk-deleted-title">タスク一覧</h2>
            <p>削除した task は一覧、Matrix、詳細から表示されず、選択状態は空になる。</p>
          </div>
          <div class="task-list-header__meta">
            <span class="count">0件選択中</span>
            <button class="card-action card-action--danger" type="button" disabled>選択したタスクを削除</button>
          </div>
        </header>

        <ol class="task-list" aria-label="一覧順で並んだ全タスク">
          <li class="task-list-card task-list-card--skipped">
            <input type="checkbox" class="task-list-card__checkbox" aria-label="Discuss browser session state を選択" />
            <button class="drag-handle" aria-label="Discuss browser session state をドラッグ">Delegate</button>
            <div class="task-list-card__body">
              <a class="task-list-card__title" href="./task-detail.html">Discuss browser session state</a>
              <p class="task-list-card__description">Confirm local-first behavior before adding sync features.</p>
            </div>
            <div class="task-list-card__actions">
              <a class="status-button" href="./task-list-status-menu.html">skipped ▾</a>
              <a class="card-action" href="./task-detail.html">詳細</a>
              <a class="card-action card-action--danger" href="./task-delete-confirm.html">削除</a>
            </div>
          </li>

          <li class="task-list-card task-list-card--active">
            <input type="checkbox" class="task-list-card__checkbox" aria-label="Remove terminal counts を選択" />
            <button class="drag-handle" aria-label="Remove terminal counts をドラッグ">Eliminate</button>
            <div class="task-list-card__body">
              <a class="task-list-card__title" href="./task-detail.html">Remove terminal counts</a>
              <p class="task-list-card__description task-list-card__description--empty">説明なし</p>
            </div>
            <div class="task-list-card__actions">
              <a class="status-button" href="./task-list-status-menu.html">active ▾</a>
              <a class="card-action" href="./task-detail.html">詳細</a>
              <a class="card-action card-action--danger" href="./task-delete-confirm.html">削除</a>
            </div>
          </li>
        </ol>
      </section>
    </main>
  </body>
</html>
