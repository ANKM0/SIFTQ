<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Matrix</title>
    <link rel="stylesheet" href="./task-redesign.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">SIFTQ</div>
        <nav class="nav" aria-label="Primary">
          <a class="active" href="./matrix-page.html">Matrix</a>
          <a href="./task-list.html">Tasks</a>
          <a href="./index.html">Index</a>
        </nav>
      </header>
      <section class="page page--matrix">
        <div class="page-header">
          <div>
            <h1 class="page-title">Matrix</h1>
            <p class="muted">Organize tasks by urgency and importance.</p>
          </div>
          <a class="button primary" href="./task-new.html">New task</a>
        </div>
        <div class="matrix matrix-axis" aria-label="Four status matrix">
          <div class="axis-line axis-line--horizontal" aria-hidden="true">
            <span>緊急度</span>
          </div>
          <div class="axis-line axis-line--vertical" aria-hidden="true">
            <span>重要度</span>
          </div>
          <section class="area area--quadrant area--q1" aria-labelledby="area-1" data-drop-area="1">
            <h2 id="area-1">1</h2>
            <a class="task-card" href="./task-detail.html" draggable="true" data-task-id="wireframes">
              <span class="task-title">0ベースのワイヤーフレームを作成</span>
            </a>
            <a class="task-card" href="./task-detail.html" draggable="true" data-task-id="task-list">
              <span class="task-title">タスク一覧画面を定義</span>
            </a>
          </section>
          <section class="area area--quadrant area--q2" aria-labelledby="area-2" data-drop-area="2">
            <h2 id="area-2">2</h2>
            <a class="task-card" href="./task-detail.html" draggable="true" data-task-id="status-vocabulary">
              <span class="task-title">ステータスの語彙を確認</span>
            </a>
          </section>
          <section class="area area--quadrant area--q3" aria-labelledby="area-3" data-drop-area="3">
            <h2 id="area-3">3</h2>
            <a class="task-card" href="./task-detail.html" draggable="true" data-task-id="old-docs">
              <span class="task-title">旧ドキュメントの退避を確認</span>
            </a>
          </section>
          <section class="area area--quadrant area--q4" aria-labelledby="area-4" data-drop-area="4">
            <h2 id="area-4">4</h2>
            <a class="task-card" href="./task-detail.html" draggable="true" data-task-id="implementation-scope">
              <span class="task-title">実装スコープを準備</span>
            </a>
          </section>
        </div>
      </section>
    </main>
    <script>
      const areas = document.querySelectorAll(".area--quadrant");
      const cards = document.querySelectorAll(".task-card[draggable='true']");
      let draggedCard = null;
      let draggedOnce = false;

      cards.forEach((card) => {
        card.addEventListener("dragstart", (event) => {
          draggedCard = card;
          draggedOnce = false;
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", card.dataset.taskId);
        });

        card.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          areas.forEach((area) => area.classList.remove("drop-target"));
          window.setTimeout(() => {
            draggedCard = null;
            draggedOnce = false;
          }, 0);
        });

        card.addEventListener("click", (event) => {
          if (draggedOnce) {
            event.preventDefault();
          }
        });
      });

      areas.forEach((area) => {
        area.addEventListener("dragover", (event) => {
          event.preventDefault();
          if (!draggedCard) return;

          draggedOnce = true;
          area.classList.add("drop-target");
          const nextCard = getNextCard(area, event.clientY);
          if (nextCard) {
            area.insertBefore(draggedCard, nextCard);
          } else {
            area.appendChild(draggedCard);
          }
        });

        area.addEventListener("dragleave", (event) => {
          if (!area.contains(event.relatedTarget)) {
            area.classList.remove("drop-target");
          }
        });

        area.addEventListener("drop", (event) => {
          event.preventDefault();
          area.classList.remove("drop-target");
        });
      });

      function getNextCard(area, y) {
        const sortableCards = [...area.querySelectorAll(".task-card:not(.dragging)")];
        return sortableCards.reduce(
          (closest, card) => {
            const box = card.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset, element: card };
            }
            return closest;
          },
          { offset: Number.NEGATIVE_INFINITY, element: null },
        ).element;
      }
    </script>
  </body>
</html>
