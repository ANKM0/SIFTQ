<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Task Detail</title>
    <link rel="stylesheet" href="./matrix-mvp.css" />
  </head>
  <body>
    <main class="app-shell task-page">
      <header class="app-header">
        <div><h1>SIFTQ</h1><p>状態: タスク詳細</p></div>
        <nav class="header-actions" aria-label="Primary">
          <a class="back-link" href="./matrix-with-cards.html">マトリックス</a>
          <a class="back-link back-link--active" href="./task-list.html">タスク一覧</a>
          <a class="back-link" href="./index.html">インデックス</a>
        </nav>
      </header>

      <section class="task-detail-shell" aria-label="タスク詳細">
        <form class="task-detail-form">
          <label>タイトル <input value="完了・スキップ済みタスクを非表示にする" /></label>
          <label>説明 <textarea>Done / Skipped にしたタスクを Matrix から隠しつつ、元のエリアを保持する。</textarea></label>
          <div class="detail-grid">
            <label>
              エリア
              <select>
                <option selected>Do</option>
                <option>Schedule</option>
                <option>Delegate</option>
                <option>Eliminate</option>
              </select>
            </label>
            <label>
              ステータス
              <select>
                <option selected>active</option>
                <option>done</option>
                <option>skipped</option>
              </select>
            </label>
          </div>
          <dl class="readonly-meta" aria-label="Task timestamps">
            <div><dt>作成日時</dt><dd>2026-06-25 12:00</dd></div>
            <div><dt>更新日時</dt><dd>2026-06-25 12:04</dd></div>
          </dl>
          <div class="task-detail-actions" aria-label="タスク操作">
            <a class="back-link detail-back-link" href="./task-list.html">⇦ 一覧へ戻る</a>
            <div class="task-detail-actions__group">
              <a class="card-action card-action--danger" href="./task-delete-confirm.html">削除</a>
              <button class="button-primary">保存</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
