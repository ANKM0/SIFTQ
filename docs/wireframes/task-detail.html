<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Task Detail</title>
    <style>
      body { font-family: sans-serif; margin: 0; background: #f6f4ef; color: #1f1f1f; }
      .shell { max-width: 960px; margin: 0 auto; padding: 24px; }
      header, .panel { background: #fff; border: 1px solid #d7d2c8; border-radius: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; }
      .panel { margin-top: 16px; padding: 20px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      label { display: grid; gap: 8px; font-weight: 700; }
      input, textarea, select { border: 1px solid #8b857a; border-radius: 12px; padding: 12px; font: inherit; }
      textarea { min-height: 120px; resize: vertical; }
      .meta { display: grid; gap: 8px; padding: 14px 16px; background: #f7f2e8; border-radius: 12px; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      .button { border: 1px solid #8b857a; background: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 700; text-decoration: none; color: #1f1f1f; }
      .primary { background: #0b4f6c; color: #fff; border-color: #0b4f6c; }
      .muted { color: #6c655d; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>タスク詳細</h1>
          <p class="muted">State: editable detail view</p>
        </div>
        <nav aria-label="page navigation">
          <a href="./matrix-mvp.html">マトリックス</a>
          <a href="./task-list.html">タスク一覧</a>
        </nav>
      </header>

      <section class="panel">
        <div class="grid">
          <label>
            title
            <input value="Fix browser storage migration" />
          </label>
          <label>
            area
            <select>
              <option selected>Do</option>
              <option>Schedule</option>
              <option>Delegate</option>
              <option>Eliminate</option>
            </select>
          </label>
          <label>
            description
            <textarea>Detail view edits the full description text.</textarea>
          </label>
          <div class="meta">
            <div><strong>作成日時</strong><br />2026-06-26 09:00</div>
            <div><strong>更新日時</strong><br />2026-06-26 09:15</div>
            <label>
              status
              <select>
                <option selected>active</option>
                <option>done</option>
                <option>skipped</option>
              </select>
            </label>
          </div>
        </div>

        <div class="actions">
          <a class="button" href="./task-delete-confirm.html">削除</a>
          <a class="button primary" href="./task-list.html">保存</a>
        </div>
      </section>
    </main>
  </body>
</html>
