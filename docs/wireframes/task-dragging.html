<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Dragging</title>
    <link rel="stylesheet" href="./task-redesign.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">SIFTQ</div>
        <nav class="nav" aria-label="Primary">
          <a class="active" href="./matrix-page.html">Matrix</a>
          <a href="./task-list.html">Tasks</a>
          <a href="./index.html">Index</a>
        </nav>
      </header>
      <section class="page">
        <div class="page-header">
          <h1 class="page-title">Area reorder</h1>
          <p class="muted">Dragging only changes order inside the same matrix area.</p>
        </div>
        <div class="matrix">
          <section class="area" aria-labelledby="drag-area-1">
            <h2 id="drag-area-1">1</h2>
            <div class="task-card dragging">
              <span class="task-title">Define task list view</span>
            </div>
            <div class="drop-line">Drop position</div>
            <a class="task-card" href="./task-detail.html">
              <span class="task-title">Write zero-base wireframes</span>
            </a>
          </section>
          <section class="area" aria-labelledby="drag-area-2">
            <h2 id="drag-area-2">2</h2>
          </section>
          <section class="area" aria-labelledby="drag-area-3">
            <h2 id="drag-area-3">3</h2>
          </section>
          <section class="area" aria-labelledby="drag-area-4">
            <h2 id="drag-area-4">4</h2>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
