<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Area Popover</title>
    <link rel="stylesheet" href="./task-redesign.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">SIFTQ</div>
        <nav class="nav" aria-label="Primary">
          <a href="./matrix-page.html">Matrix</a>
          <a class="active" href="./task-list.html">Tasks</a>
          <a href="./index.html">Index</a>
        </nav>
      </header>
      <section class="page">
        <div class="page-header">
          <h1 class="page-title">Task detail</h1>
          <a class="button" href="./task-list.html">Tasks</a>
        </div>
        <div class="detail-grid">
          <section class="form-panel">
            <label>
              Title
              <input value="Confirm status vocabulary" />
            </label>
            <label>
              Description
              <textarea>Area changes use the same popover shape as status changes.</textarea>
            </label>
            <a class="button primary" href="./task-area-menu.html">Save</a>
          </section>
          <aside class="side-panel side-panel--popover-open">
            <div class="meta-row meta-row-link" role="link" tabindex="0" onclick="location.href='./task-status-menu.html'">
              <h2>Status</h2>
              <span class="meta-caret" aria-hidden="true">▾</span>
            </div>
            <a class="status status--do" href="./task-status-menu.html">do</a>
            <div class="meta-row meta-row-link meta-row--spaced" role="link" tabindex="0" onclick="location.href='./task-area-menu.html'">
              <h2>Area</h2>
              <span class="meta-caret" aria-hidden="true">▾</span>
            </div>
            <a class="status area-badge" href="./task-area-menu.html">2</a>
            <section class="popover" aria-label="Area choices">
              <h3>Apply area to this task</h3>
              <div class="status-group-title">Selected area</div>
              <a class="status-choice selected" href="./task-detail.html">
                <span class="check">✓</span>
                <span class="status-dot status-dot--two"></span>
                <span><strong>2</strong><br /><span class="muted">Matrix quadrant.</span></span>
              </a>
              <div class="status-group-title">Suggestions</div>
              <a class="status-choice" href="./task-detail.html">
                <span class="box"></span>
                <span class="status-dot status-dot--one"></span>
                <span><strong>1</strong><br /><span class="muted">Matrix quadrant.</span></span>
              </a>
              <a class="status-choice" href="./task-detail.html">
                <span class="box"></span>
                <span class="status-dot status-dot--three"></span>
                <span><strong>3</strong><br /><span class="muted">Matrix quadrant.</span></span>
              </a>
              <a class="status-choice" href="./task-detail.html">
                <span class="box"></span>
                <span class="status-dot status-dot--four"></span>
                <span><strong>4</strong><br /><span class="muted">Matrix quadrant.</span></span>
              </a>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
