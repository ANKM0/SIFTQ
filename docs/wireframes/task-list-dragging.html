<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - Task List Dragging</title>
    <style>
      body { font-family: sans-serif; margin: 0; background: #f6f4ef; color: #1f1f1f; }
      .shell { max-width: 1100px; margin: 0 auto; padding: 24px; }
      header, .card, .drop { background: #fff; border: 1px solid #d7d2c8; border-radius: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; }
      nav a { margin-left: 12px; color: #0b4f6c; text-decoration: none; font-weight: 700; }
      .list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
      .card { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: start; padding: 16px; }
      .dragging { opacity: 0.65; outline: 2px dashed #0b4f6c; }
      .drop { margin-top: 16px; padding: 14px 16px; border-style: dashed; color: #5a5145; }
      .drop--active { border-color: #0b4f6c; background: #e8f3ea; }
      .handle { display: grid; gap: 6px; place-items: center; border: 1px dashed #a79f93; border-radius: 12px; min-height: 64px; padding: 10px 8px; font-weight: 700; text-align: center; }
      .handle__icon { font-size: 1.1rem; line-height: 1; }
      .handle__area { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
      .button { border: 1px solid #8b857a; background: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 700; text-decoration: none; color: #1f1f1f; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>タスク一覧</h1>
          <p>State: dragging via handle</p>
        </div>
        <nav aria-label="page navigation">
          <a href="./matrix-mvp.html">マトリックス</a>
          <a href="./task-list.html">タスク一覧</a>
        </nav>
      </header>

      <div class="drop">Drop here to insert between cards</div>

      <ul class="list" aria-label="task list">
        <li class="card dragging">
          <div class="handle" aria-label="Do のドラッグハンドル">
            <span class="handle__icon">↕</span>
            <span class="handle__area">Do</span>
          </div>
          <div>
            <h2>Move me lower</h2>
            <p>Dragging card remains readable and still shows area label.</p>
          </div>
          <button class="button">active</button>
        </li>
        <li class="card">
          <div class="handle" aria-label="Schedule のドラッグハンドル">
            <span class="handle__icon">↕</span>
            <span class="handle__area">Schedule</span>
          </div>
          <div>
            <h2>Target task</h2>
            <p>Drop target remains stable while item is dragged.</p>
          </div>
          <button class="button">done</button>
        </li>
      </ul>

      <div class="drop drop--active">Drop target for reordered position</div>
    </main>
  </body>
</html>
