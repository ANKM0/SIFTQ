<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIFTQ Wireframe - New Task</title>
    <link rel="stylesheet" href="./task-redesign.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">SIFTQ</div>
        <nav class="nav" aria-label="Primary">
          <a href="./matrix-page.html">Matrix</a>
          <a href="./task-list.html">Tasks</a>
          <a href="./index.html">Index</a>
        </nav>
      </header>
      <section class="page">
        <div class="page-header">
          <h1 class="page-title">New task</h1>
        </div>
        <div class="detail-grid">
          <form class="form-panel">
            <label>
              Title
              <input placeholder="Task title" />
            </label>
            <label>
              Description
              <textarea placeholder="Task description"></textarea>
            </label>
            <div class="form-actions">
              <a class="button" href="./task-list.html">Cancel</a>
              <a class="button primary" href="./task-detail.html">Create</a>
            </div>
          </form>
          <aside class="side-panel">
            <div class="meta-row meta-row-link" role="link" tabindex="0" onclick="location.href='./task-status-menu.html'">
              <h2>Status</h2>
              <span class="meta-caret" aria-hidden="true">▾</span>
            </div>
            <a class="status status--do" href="./task-status-menu.html">do</a>
            <div class="meta-row meta-row-link meta-row--spaced" role="link" tabindex="0" onclick="location.href='./task-area-menu.html'">
              <h2>Area</h2>
              <span class="meta-caret" aria-hidden="true">▾</span>
            </div>
            <a class="status area-badge" href="./task-area-menu.html">1</a>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
