<svg xmlns="http://www.w3.org/2000/svg" width="850" height="560" viewBox="0 0 850 560" role="img" aria-labelledby="title desc">
  <title id="title">軽量アプリケーションアーキテクチャの4レイヤー概念図</title>
  <desc id="desc">Driver Side から presentation 層へ入り、presentation と gateway が外側、usecase が中間、domain が中心にある。gateway から Driven Side へ出る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
    </marker>
  </defs>

  <rect width="850" height="560" fill="#ffffff" />

  <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="15" fill="#666666">
    <rect x="74" y="78" width="120" height="45" fill="#ffffff" stroke="#777777" />
    <text x="134" y="106" text-anchor="middle">Driver Side</text>

    <rect x="596" y="472" width="120" height="45" fill="#ffffff" stroke="#777777" />
    <text x="656" y="500" text-anchor="middle">Driven Side</text>

    <line x1="194" y1="101" x2="275" y2="171" stroke="#555555" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="521" y1="421" x2="597" y2="486" stroke="#555555" stroke-width="3" marker-end="url(#arrow)" />

    <circle cx="398" cy="298" r="175" fill="#d9ead3" stroke="#8a8a8a" />
    <circle cx="398" cy="298" r="113" fill="#f4cccc" stroke="#8a8a8a" />
    <circle cx="398" cy="298" r="58" fill="#fff2cc" stroke="#8a8a8a" />

    <text x="398" y="224" text-anchor="middle" font-weight="600">usecase</text>
    <text x="398" y="304" text-anchor="middle" font-weight="600">domain</text>

    <text x="304" y="221" text-anchor="middle" transform="rotate(-48 304 221)">presentation</text>
    <text x="490" y="421" text-anchor="middle" transform="rotate(-48 490 421)">gateway</text>
  </g>

  <text x="425" y="547" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#000000">
    presentation, usecase, domain, gateway の4レイヤー
  </text>
</svg>
