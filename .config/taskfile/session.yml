version: "3"

tasks:
  session:backup:
    desc: Encrypt codex and opencode sessions into sessions/ with zstd and age.
    cmds:
      - uv run python scripts/session_backup.py backup {{.CLI_ARGS}}

  session:restore:
    desc: Decrypt session archives from sessions/ using the age identity.
    cmds:
      - uv run python scripts/session_backup.py restore {{.CLI_ARGS}}
