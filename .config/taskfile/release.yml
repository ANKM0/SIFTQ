version: "3"

tasks:
  release:plan:
    desc: Print a read-only release plan.
    cmds:
      - uv run python scripts/release_deploy.py plan {{.CLI_ARGS}}

  release:create:
    desc: Create and push an annotated release tag at the checked-out SHA.
    cmds:
      - uv run python scripts/release_deploy.py release {{.CLI_ARGS}}

  deploy:plan:
    desc: Print deployment prerequisites without changing state.
    cmds:
      - uv run python scripts/release_deploy.py plan {{.CLI_ARGS}}

  deploy:release:
    desc: Verify a release tag and deploy the Worker.
    cmds:
      - uv run python scripts/release_deploy.py deploy {{.CLI_ARGS}}

  deploy:
    desc: Deploy the Worker to Cloudflare.
    cmds:
      - |
        set -eu
        secrets_file="${SECRETS_FILE:-tmp/cloudflare-secrets.env}"
        if [ ! -f "$secrets_file" ]; then
          echo "Missing $secrets_file. Run 'task deploy:secrets' first or set SECRETS_FILE." >&2
          exit 1
        fi
        bun x cf deploy --secrets-file "$secrets_file"

  deploy:secrets:
    desc: Write Worker auth secrets to a local file for cf deploy.
    cmds:
      - |
        set -eu
        password="${AUTH_PASSWORD:-}"
        secret="${SESSION_SECRET:-}"
        if [ -z "$password" ]; then
          printf 'AUTH_PASSWORD: '
          IFS= read -r password
        fi
        if [ -z "$secret" ]; then
          printf 'SESSION_SECRET: '
          IFS= read -r secret
        fi
        mkdir -p tmp
        umask 077
        {
          printf 'AUTH_PASSWORD=%s\n' "$password"
          printf 'SESSION_SECRET=%s\n' "$secret"
        } > tmp/cloudflare-secrets.env
        echo "Wrote secrets to tmp/cloudflare-secrets.env"
