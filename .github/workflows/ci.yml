name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: write

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and check commit messages
        id: filter
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
            echo "src=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base" "$head" | grep -qvE '^(docs/|.*\.md$)'; then
              echo "src=true" >> "$GITHUB_OUTPUT"
            else
              echo "src=false" >> "$GITHUB_OUTPUT"
            fi
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "src=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$base" "$head" | grep -qvE '^(docs/|.*\.md$)'; then
              echo "src=true" >> "$GITHUB_OUTPUT"
            else
              echo "src=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          python scripts/ci/check_commit_messages.py "$base" "$head"

  fast:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci
        with:
          frontend: ${{ needs.changes.outputs.src == 'true' }}

      - name: Run fast gate
        shell: bash
        run: |
          if [ "${{ needs.changes.outputs.src }}" = "true" ]; then
            task ci:fast
          else
            task ci:docs-fast
          fi

  extended:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci

      - name: Run extended gate
        run: task ci:extended

  e2e:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci
        with:
          playwright: "true"

      - name: Run E2E gate
        run: task ci:test:e2e
