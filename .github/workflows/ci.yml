name: CI

on:
  pull_request:

permissions:
  contents: read
  actions: write

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        shell: bash
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          python scripts/ci/check_commit_messages.py "$base" "$head"

  fast:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci
        with:
          frontend: "true"

      - name: Run fast gate
        run: task ci:fast

  extended:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci

      - name: Run extended gate
        run: task ci:extended

  e2e:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up CI tools
        uses: ./.github/actions/setup-ci
        with:
          playwright: "true"

      - name: Run E2E gate
        run: task ci:test:e2e

  merge-gate:
    needs: [changes, fast, extended, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the appropriate checks
        shell: bash
        run: |
          set -eu
          echo "changes=${{ needs.changes.result }}"
          echo "fast=${{ needs.fast.result }}"
          echo "extended=${{ needs.extended.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.fast.result }}" = success
          test "${{ needs.extended.result }}" = success
          test "${{ needs.e2e.result }}" = success
