name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: write

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect source changes
        id: filter
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore aqua tools cache
        id: cache-aqua
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-${{ runner.os }}-${{ hashFiles('aqua.yaml', 'aqua-policy.yaml') }}

      - name: Restore Vite+ cache
        id: cache-vp
        uses: actions/cache@v4
        with:
          path: ~/.local/share/vite-plus
          key: vp-${{ runner.os }}-v1.18.0

      - name: Install aqua
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.59.0

      - name: Add cached aqua to PATH
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> "$GITHUB_PATH"

      - name: Install repository tools
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        run: |
          aqua policy allow aqua-policy.yaml
          aqua install

      - name: Allow aqua policy
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: aqua policy allow aqua-policy.yaml

      - name: Set up Vite+
        if: steps.cache-vp.outputs.cache-hit != 'true'
        uses: voidzero-dev/setup-vp@v1.18.0

      - name: Add cached Vite+ to PATH
        if: steps.cache-vp.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify tools
        run: command -v task && command -v vp && command -v bun

      - name: Check commit messages
        run: task ci:commit-messages -- "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run fast gate
        run: task ci:fast

  extended:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore aqua tools cache
        id: cache-aqua
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-${{ runner.os }}-${{ hashFiles('aqua.yaml', 'aqua-policy.yaml') }}

      - name: Restore Vite+ cache
        id: cache-vp
        uses: actions/cache@v4
        with:
          path: ~/.local/share/vite-plus
          key: vp-${{ runner.os }}-v1.18.0

      - name: Install aqua
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.59.0

      - name: Add cached aqua to PATH
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> "$GITHUB_PATH"

      - name: Install repository tools
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        run: |
          aqua policy allow aqua-policy.yaml
          aqua install

      - name: Allow aqua policy
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: aqua policy allow aqua-policy.yaml

      - name: Set up Vite+
        if: steps.cache-vp.outputs.cache-hit != 'true'
        uses: voidzero-dev/setup-vp@v1.18.0

      - name: Add cached Vite+ to PATH
        if: steps.cache-vp.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify tools
        run: command -v task && command -v vp && command -v bun

      - name: Run extended gate
        run: task ci:extended

  e2e:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore aqua tools cache
        id: cache-aqua
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-${{ runner.os }}-${{ hashFiles('aqua.yaml', 'aqua-policy.yaml') }}

      - name: Restore Vite+ cache
        id: cache-vp
        uses: actions/cache@v4
        with:
          path: ~/.local/share/vite-plus
          key: vp-${{ runner.os }}-v1.18.0

      - name: Restore Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: taskfile/tmp/playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}

      - name: Install aqua
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.59.0

      - name: Add cached aqua to PATH
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> "$GITHUB_PATH"

      - name: Install repository tools
        if: steps.cache-aqua.outputs.cache-hit != 'true'
        run: |
          aqua policy allow aqua-policy.yaml
          aqua install

      - name: Allow aqua policy
        if: steps.cache-aqua.outputs.cache-hit == 'true'
        run: aqua policy allow aqua-policy.yaml

      - name: Set up Vite+
        if: steps.cache-vp.outputs.cache-hit != 'true'
        uses: voidzero-dev/setup-vp@v1.18.0

      - name: Add cached Vite+ to PATH
        if: steps.cache-vp.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify tools
        run: command -v task && command -v vp && command -v bun

      - name: Run E2E gate
        run: task ci:test:e2e
