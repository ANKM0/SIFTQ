name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install aqua
        uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.59.0

      - name: Install repository tools
        run: aqua install

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install Python dependencies
        run: task setup:python

      - name: Install frontend dependencies
        run: task setup:frontend:ci

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check sympohy project configuration
        run: task ci:sympohy

      - name: Check commit messages
        run: task ci:commit-messages -- "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Check Markdown
        run: task ci:markdown

      - name: Check CI task references
        run: task ci:lint:task-refs

      - name: Check Codex task permissions
        run: task ci:lint:codex-task-perms

      - name: Typecheck
        run: task ci:typecheck

      - name: Lint
        run: task ci:lint

      - name: Test
        run: task ci:test

      - name: Build
        run: task ci:build

      - name: Check CoDD version
        run: task codd:version

      - name: Scan CoDD graph
        run: task codd:scan

      - name: Validate CoDD documents
        run: task codd:validate

      - name: Verify CoDD DAG
        run: task codd:dag
