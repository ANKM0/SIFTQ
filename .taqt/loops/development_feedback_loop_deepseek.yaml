version: 1
id: development_feedback_loop_deepseek

limits:
  max_iterations: 12
  max_fix_attempts: 2

agents:
  design:
    role: design
    adapter: codex
    model: deepseek-v4-pro
    reasoning_effort: high
    writes:
      - .taqt/loops/
      - .taqt/tests/
      - docs/requirements/
      - docs/wireframes/
      - docs/adr/
      - docs/contributing/
  test:
    role: test_author
    adapter: codex
    model: deepseek-v4-flash
    reasoning_effort: low
    writes:
      - tests/
      - .taqt/tests/
  implement:
    role: implementation
    adapter: codex
    model: deepseek-v4-flash
    reasoning_effort: low
  fix:
    role: implementation_fixer
    adapter: codex
    model: deepseek-v4-flash
    reasoning_effort: low
  checker:
    role: checker
    adapter: codex
    model: deepseek-v4-flash
    reasoning_effort: low
    readonly: true

steps:
  - id: design
    kind: llm
    agent: design
    next: test

  - id: test
    kind: llm
    agent: test
    next: implement

  - id: implement
    kind: llm
    agent: implement
    next: observe

  - id: observe
    kind: commands
    run:
      - task ci:markdown
      - task ci:typecheck
      - task ci:lint
      - task ci:lint:python
      - task ci:lint:ts-fast
      - task ci:security
      - task ci:performance
      - task ci:requirements
      - task ci:architecture
      - task ci:glossary
      - task ci:docs
      - task ci:test
      - task ci:build
    on_success: checker
    on_failure: decide

  - id: fix
    kind: llm
    agent: fix
    next: observe
    on_failure: human

  - id: decide
    kind: policy
    routes:
      - when: implementation_feedback
        next: fix
      - when: test_feedback
        next: fix
      - when: local_design_feedback
        next: design
      - when: specification_feedback
        next: human
      - when: product_feedback
        next: human
      - when: unknown
        next: human

  - id: checker
    kind: llm
    agent: checker
    next: done
    on_failure: fix

  - id: done
    kind: terminal

  - id: human
    kind: terminal
