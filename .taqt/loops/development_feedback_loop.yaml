version: 1
id: development_feedback_loop

limits:
  max_iterations: 12
  max_fix_attempts: 3

agents:
  design:
    role: design
    adapter: codex
    model: gpt-5.6-luna
    reasoning_effort: xhigh
    writes:
      - .taqt/loops/
      - docs/requirements/
      - docs/wireframes/
      - docs/adr/
      - docs/contributing/
  test:
    role: test_author
    adapter: codex
    model: gpt-5.6-luna
    reasoning_effort: xhigh
    writes:
      - tests/
      - .taqt/tests/
  implement:
    role: implementation
    adapter: codex
    model: gpt-5.6-luna
    reasoning_effort: max
  checker:
    role: checker
    adapter: codex
    model: gpt-5.6-sol
    reasoning_effort: high
    readonly: true

steps:
  - id: design
    kind: llm
    agent: design
    next: test

  - id: test
    kind: llm
    agent: test
    next: implement

  - id: implement
    kind: llm
    agent: implement
    next: observe

  - id: observe
    kind: commands
    run:
      - task ci:markdown
      - task ci:typecheck
      - task ci:lint
      - task ci:security
      - task ci:performance
      - task ci:test
      - task ci:build
    on_success: checker
    on_failure: decide

  - id: decide
    kind: policy
    routes:
      - when: implementation_feedback
        next: implement
      - when: test_feedback
        next: test
      - when: local_design_feedback
        next: design
      - when: specification_feedback
        next: human
      - when: product_feedback
        next: human
      - when: unknown
        next: human

  - id: checker
    kind: llm
    agent: checker
    next: done

  - id: done
    kind: terminal

  - id: human
    kind: terminal
