version: 1
id: development_feedback_loop_luna

limits:
  max_iterations: 12
  max_fix_attempts: 2

agents:
  design:
    role: design
    adapter: codex
    profile: luna-openrouter
    model: openai/gpt-5.6-luna
    reasoning_effort: xhigh
    writes:
      - .taqt/loops/
      - .taqt/tests/
      - docs/requirements/
      - docs/wireframes/
      - docs/adr/
      - docs/contributing/
  test:
    role: test_author
    adapter: codex
    profile: luna-openrouter
    model: openai/gpt-5.6-luna
    reasoning_effort: xhigh
    writes:
      - tests/
      - .taqt/tests/
  implement:
    role: implementation
    adapter: codex
    profile: muse-spark-openrouter
    model: meta/muse-spark-1.3
    reasoning_effort: high
  fix:
    role: implementation_fixer
    adapter: codex
    profile: muse-spark-openrouter
    model: meta/muse-spark-1.3
    reasoning_effort: high
  checker:
    role: checker
    adapter: codex
    profile: luna-openrouter
    model: openai/gpt-5.6-luna
    reasoning_effort: xhigh
    readonly: true

steps:
  - id: design
    kind: llm
    agent: design
    next: test

  - id: test
    kind: llm
    agent: test
    next: implement

  - id: implement
    kind: llm
    agent: implement
    next: verification

  - id: verification
    kind: verification
    on_pass: checker
    on_fix: decide
    on_human: human

  - id: fix
    kind: llm
    agent: fix
    next: verification
    on_failure: human

  - id: decide
    kind: policy
    routes:
      - when: implementation_feedback
        next: fix
      - when: test_feedback
        next: fix
      - when: local_design_feedback
        next: design
      - when: specification_feedback
        next: human
      - when: product_feedback
        next: human
      - when: unknown
        next: human

  - id: checker
    kind: llm
    agent: checker
    next: post_review

  - id: post_review
    kind: post_review
    on_pass: done
    on_fix: fix
    on_human: human

  - id: done
    kind: terminal

  - id: human
    kind: terminal
